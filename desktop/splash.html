<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Amura OS - Inicializando...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1b212e 0%, #0c1017 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
      animation: fadeIn 0.8s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-img {
      height: 52px;
      max-width: 320px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 14px;
      letter-spacing: 0.3px;
      font-weight: 500;
    }
    .loader-box {
      width: 280px;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-top: 15px;
    }
    .loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #d92078, #f56542);
      border-radius: 4px;
      position: absolute;
      animation: loading 1.5s infinite ease-in-out;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
      font-weight: 500;
    }
    @keyframes loading {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="../assets/img/Logo-Claro2.png" class="logo-img" alt="Amura Sistemas">
    <div class="subtitle">Sistema de Controle de Ordens de Serviço</div>
  </div>
  
  <div class="loader-box">
    <div class="loader-bar"></div>
  </div>
  
  <div class="status-text" id="status">Iniciando serviços do sistema...</div>

  <script>
    const messages = [
      'Iniciando serviços do sistema...',
      'Verificando conexão com o banco de dados...',
      'Carregando módulos da aplicação...'
    ];
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      const el = document.getElementById('status');
      if (el) el.innerText = messages[idx];
    }, 1200);
  </script>
</body>
</html>
